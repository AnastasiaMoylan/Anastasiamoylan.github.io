ivo', 'Inter', system-ui, sans-serif" font-size="17" font-weight="700" fill="#1b2433" text-anchor="start">Two failed IVR top-ups this week, then a call.</text><rect x="796" y="202" width="548" height="8" rx="4" fill="#dfe4ea"/><rect x="796" y="220" width="504.16" height="8" rx="4" fill="#dfe4ea"/><rect x="796" y="238" width="526.0799999999999" height="8" rx="4" fill="#dfe4ea"/><rect x="796" y="256" width="317.84" height="8" rx="4" fill="#dfe4ea"/><rect x="796" y="296" width="548" height="200" rx="10" fill="#f0f0fb" stroke="#8e91e0" stroke-width="1"/><text x="812" y="322" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#5c6675" text-anchor="start" letter-spacing="1.2">SUGGESTED COURSE OF ACTION</text><text x="812" y="352" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="700" fill="#1b2433" text-anchor="start">Offer the 5-day top-up credit</text><text x="812" y="374" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#5c6675" text-anchor="start">Within policy · retention offer, single use</text><circle cx="821" cy="407" r="9" fill="#15803d"/><path d="M817 407l3 3 5-6" fill="none" stroke="#ffffff" stroke-width="1.8"/><text x="840" y="412" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="400" fill="#1b2433" text-anchor="start">Eligible: no credit in the last 90 days</text><circle cx="821" cy="437" r="8" fill="#ffffff" stroke="#4348c9" stroke-width="2"/><circle cx="821" cy="437" r="3" fill="#4348c9"/><text x="840" y="442" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="600" fill="#1b2433" text-anchor="start">Representative decides</text><rect x="812" y="458" width="113.92" height="30" rx="5" fill="#4348c9" stroke="#4348c9" stroke-width="1.5"/><text x="868.96" y="477.32" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Apply offer</text><rect x="928