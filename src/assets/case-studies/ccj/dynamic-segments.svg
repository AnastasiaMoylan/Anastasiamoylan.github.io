<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1440 900" width="1440" height="900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cj-seg-title cj-seg-desc">
  <title id="cj-seg-title">Dynamic segments</title>
  <desc id="cj-seg-desc">A segment builder with four criteria, issue, behaviour, likelihood to churn and an exclusion, beside a live count of matching customers and a churn-likelihood histogram, and below it the path from journey data through segment and mitigation plan to a what-if test and human review.</desc>
  <defs>
    <filter id="cj-seg-shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/></filter>
    <pattern id="cj-seg-grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="rgba(237,221,212,0.06)" stroke-width="1"/></pattern>
    <marker id="cj-seg-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#6b7f99"/></marker>
    <marker id="cj-seg-arrow-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#4348c9"/></marker>
    <marker id="cj-seg-arrow-r" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#dbc9c9"/></marker>
  </defs>
  <rect width="1440" height="900" fill="#1d2d2b"/>
  
<rect x="64" y="56" width="1312" height="788" rx="12" fill="#ffffff" stroke="#d5dbe3" stroke-width="1" filter="url(#cj-seg-shadow)"/><rect x="64" y="56" width="1312" height="52" rx="0" fill="#e9edf2"/><path d="M64 108H1376" stroke="#d5dbe3"/><path d="M88 82l8-8 8 8-8 8z" fill="#4348c9"/><text x="112" y="87" font-family="'Archivo', 'Inter', system-ui, sans-serif" font-size="14" font-weight="700" fill="#1b2433" text-anchor="start" letter-spacing="0.3">Customer journeys</text><text x="299.93600000000004" y="87" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="400" fill="#5c6675" text-anchor="start">/  Segments</text><text x="398.0160000000001" y="87" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="400" fill="#5c6675" text-anchor="start">/  IVR top-up failures</text><circle cx="1346" cy="82" r="12" fill="#dbe2ea"/><circle cx="1346" cy="78" r="4.5" fill="#46596f"/><path d="M1337 90a9 6 0 0 1 18 0z" fill="#46596f"/><text x="104" y="160" font-family="'Archivo', 'Inter', system-ui, sans-serif" font-size="24" font-weight="700" fill="#1b2433" text-anchor="start">Segment · built from churn-risk criteria</text><rect x="655.6" y="142" width="161.68" height="24" rx="12" fill="#dcf2e3"/><text x="736.44" y="157.96" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="600" fill="#15803d" text-anchor="middle">Live · refreshed hourly</text><rect x="104" y="206" width="760" height="56" rx="8" fill="#ffffff" stroke="#d5dbe3" stroke-width="1"/><rect x="104" y="206" width="6" height="56" rx="3" fill="#4348c9"/><text x="128" y="228" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#4348c9" text-anchor="start" letter-spacing="1.2">ISSUE</text><text x="128" y="250" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="700" fill="#1b2433" text-anchor="start">Top-up failed</text><text x="394" y="250" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="400" fill="#5c6675" text-anchor="start">in the last 7 days</text><text x="848" y="242" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#5c6675" text-anchor="end"></text><rect x="104" y="276" width="760" height="56" rx="8" fill="#ffffff" stroke="#d5dbe3" stroke-width="1"/><rect x="104" y="276" width="6" height="56" rx="3" fill="#4348c9"/><text x="128" y="298" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#4348c9" text-anchor="start" letter-spacing="1.2">BEHAVIOUR</text><text x="128" y="320" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="700" fill="#1b2433" text-anchor="start">2 or more IVR attempts</text><text x="394" y="320" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="400" fill="#5c6675" text-anchor="start">then no successful top-up</text><text x="848" y="312" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#5c6675" text-anchor="end">and</text><rect x="104" y="346" width="760" height="56" rx="8" fill="#ffffff" stroke="#d5dbe3" stroke-width="1"/><rect x="104" y="346" width="6" height="56" rx="3" fill="#4348c9"/><text x="128" y="368" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#4348c9" text-anchor="start" letter-spacing="1.2">LIKELIHOOD TO CHURN</text><text x="128" y="390" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="700" fill="#1b2433" text-anchor="start">Model score above 0.60</text><text x="394" y="390" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="400" fill="#5c6675" text-anchor="start">high-confidence tier only</text><text x="848" y="382" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#5c6675" text-anchor="end">and</text><rect x="104" y="416" width="760" height="56" rx="8" fill="#ffffff" stroke="#d5dbe3" stroke-width="1"/><rect x="104" y="416" width="6" height="56" rx="3" fill="#5c6675"/><text x="128" y="438" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#5c6675" text-anchor="start" letter-spacing="1.2">EXCLUDE</text><text x="128" y="460" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="700" fill="#1b2433" text-anchor="start">Offered a credit</text><text x="394" y="460" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="400" fill="#5c6675" text-anchor="start">in the last 90 days</text><text x="848" y="452" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#5c6675" text-anchor="end">and</text><rect x="104" y="494" width="149.20000000000002" height="34" rx="5" fill="#ffffff" stroke="#1b2433" stroke-width="1.5"/><text x="178.60000000000002" y="515.68" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="600" fill="#1b2433" text-anchor="middle">Add a criterion</text><rect x="904" y="206" width="432" height="336" rx="10" fill="#f3f5f8" stroke="#d5dbe3" stroke-width="1"/><text x="928" y="236" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#5c6675" text-anchor="start" letter-spacing="1.2">CUSTOMERS MATCHING NOW</text><text x="928" y="296" font-family="'Archivo', 'Inter', system-ui, sans-serif" font-size="56" font-weight="800" fill="#4348c9" text-anchor="start">1,240</text><text x="928" y="322" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="400" fill="#5c6675" text-anchor="start">From journey data, not a snapshot. Was 1,310 an hour ago.</text><text x="928" y="362" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#5c6675" text-anchor="start" letter-spacing="1.2">CHURN LIKELIHOOD IN THIS SEGMENT</text><path d="M928 466H1312" stroke="#d5dbe3"/><rect x="928" y="452.5" width="48" height="13.5" rx="3" fill="#6b7f99"/