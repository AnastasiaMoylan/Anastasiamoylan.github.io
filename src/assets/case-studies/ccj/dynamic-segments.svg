fill="#ffffff" stroke="#d5dbe3" stroke-width="1"/><text x="140" y="660" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="700" fill="#1b2433" text-anchor="start">Journey data</text><text x="140" y="682" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="400" fill="#5c6675" text-anchor="start">Every top-up attempt, by</text><text x="140" y="698" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="400" fill="#5c6675" text-anchor="start">channel</text><path d="M345.2 680H365.2" stroke="#4348c9" stroke-width="1.6" marker-end="url(#cj-seg-arrow-m)"/><rect x="367.2" y="630" width="219.2" height="100" rx="8" fill="#4348c9" stroke="#4348c9" stroke-width="1"/><text x="383.2" y="660" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="start">Segment</text><text x="383.2" y="682" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="400" fill="#e1e2f8" text-anchor="start">1,240 customers, recomputed</text><text x="383.2" y="698" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="400" fill="#e1e2f8" text-anchor="start">hourly</text><path d="M588.4 680H608.4" stroke="#4348c9" stroke-width="1.6" marker-end="url(#cj-seg-arrow-m)"/><rect x="610.4" y="630" width="219.2" height="100" rx="8" fill="#ffffff" stroke="#d5dbe3" stroke-width="1"/><text x="626.4" y="660" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="700" fill="#1b2433" text-anchor="start">Mitigation plan</text><text x="626.4" y="682" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="400" fill="#5c6675" text-anchor="start">Drivers and one recommended</text><text x="626.4" y="698" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="400" fill="#5c6675" text-anchor="start">action</text><path d="M831.5999999999999 680H851.5999999999999" stroke="#4348c9" stroke-width="1.6" marker-end="url(#cj-seg-arrow-m)"/><rect x="853.5999999999999" y="630" width="219.2" height="100" rx="8" fill="#ffffff" stroke="#d5dbe3" stroke-width="1"/><text x="869.5999999999999" y="660" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="700" fill="#1b2433" text-anchor="start">What-if</text><text x="869.5999999999999" y="682" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="400" fill="#5c6675" text-anchor="start">Test the offer before it</text><text x="869.5999999999999" y="698" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="400" fill="#5c6675" text-anchor="start">runs</text><path d="M1074.8 680H1094.8" stroke="#4348c9" stroke-width="1.6" marker-end="url(#cj-seg-arrow-m)"/><rect x="1096.8" y="630" width="219.2" height="100" rx="8" fill="#ffffff" stroke="#d5dbe3" stroke-width="1"/><text x="1112.8" y="660" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="700" fill="#1b2433" text-anchor="start">Review</text><text x="1112.8" y="682" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="400" fill="#5c6675" text-anchor="start">A person approves the send</text>
