<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1440 720" width="1440" height="720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cj-journey-title cj-journey-desc">
  <title id="cj-journey-title">Journey exploration</title>
  <desc id="cj-journey-desc">A branching journey: top-up attempts split by mobile app, SMS and IVR, each into continued or failed paths with their churn rates; the IVR failure with no retry offered is the worst path and is highlighted as the mitigation target.</desc>
  <defs>
    <filter id="cj-journey-shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.14"/></filter>
    <pattern id="cj-journey-grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="rgba(40,61,59,0.06)" stroke-width="1"/></pattern>
    <marker id="cj-journey-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#6b8f8a"/></marker>
    <marker id="cj-journey-arrow-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#6e2a2a"/></marker>
    <marker id="cj-journey-arrow-r" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#dbc9c9"/></marker>
  </defs>
  <rect width="1440" height="720" fill="#f7f5f1"/>
  
<text x="64" y="56" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#3e5b58" text-anchor="start" letter-spacing="1.2">JOURNEY EXPLORATION · TOP-UP FAILURE, BY CHANNEL</text><text x="64" y="96" font-family="'Archivo', 'Inter', system-ui, sans-serif" font-size="26" font-weight="700" fill="#283d3b" text-anchor="start">Where a failed top-up turns into churn</text><text x="64" y="122" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="400" fill="#57514b" text-anchor="start">Percentages are the share of customers on that path who churned within 30 days. Illustrative values.</text><rect x="64" y="300" width="200" height="62" rx="8" fill="#283d3b" stroke="#283d3b" stroke-width="1.4"/><text x="78" y="326" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="start">Top-up attempted</text><text x="78" y="346" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#dbc9c9" text-anchor="start">100% of customers</text><path d="M264 331C312 331 312 201 360 201" fill="none" stroke="#6b8f8a" stroke-width="2" stroke-opacity="0.8"/><rect x="360" y="170" width="200" height="62" rx="8" fill="#ffffff" stroke="#283d3b" stroke-width="1.4"/><text x="374" y="196" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="700" fill="#283d3b" text-anchor="start">Mobile app</text><text x="374" y="216" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#57514b" text-anchor="start">48% of attempts</text><path d="M264 331C312 331 312 331 360 331" fill="none" stroke="#6b8f8a" stroke-width="2" stroke-opacity="0.8"/><rect x="360" y="300" width="200" height="62" rx="8" fill="#ffffff" stroke="#283d3b" stroke-width="1.4"/><text x="374" y="326" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="700" fill="#283d3b" text-anchor="start">SMS</text><text x="374" y="346" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#57514b" text-anchor="start">22% of attempts</text><path d="M264 331C312 331 312 461 360 461" fill="none" stroke="#6b8f8a" stroke-width="2" stroke-opacity="0.8"/><rect x="360" y="430" width="200" height="62" rx="8" fill="#ffffff" stroke="#283d3b" stroke-width="1.4"/><text x="374" y="456" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="700" fill="#283d3b" text-anchor="start">IVR</text><text x="374" y="476" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#57514b" text-anchor="start">30% of attempts</text><path d="M560 201C620 201 620 161 680 161" fill="none" stroke="#6b8f8a" stroke-width="2" stroke-opacity="0.8"/><rect x="680" y="130" width="220" height="62" rx="8" fill="#ffffff" stroke="#283d3b" stroke-width="1.4"/><text x="694" y="156" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="700" fill="#283d3b" text-anchor="start">Continued</text><text x="694" y="176" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#57514b" text-anchor="start">91% · 2% churn</text><path d="M560 201C620 201 620 241 680 241" fill="none" stroke="#6b8f8a" stroke-width="2" stroke-opacity="0.8"/><rect x="680" y="210" width="220" height="62" rx="8" fill="#ffffff" stroke="#283d3b" stroke-width="1.4"/><text x="694" y="236" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="700" fill="#283d3b" text-anchor="start">Failed at PIN</text><text x="694" y="256" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#57514b" text-anchor="start">9% · 14% churn</text><path d="M560 331C620 331 620 321 680 321" fill="none" stroke="#6b8f8a" stroke-width="2" stroke-opacity="0.8"/><rect x="680" y="290" width="220" height="62" rx="8" fill="#ffffff" stroke="#283d3b" stroke-width="1.4"/><text x="694" y="316" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="700" fill="#283d3b" text-anchor="start">Continued</text><text x="694" y="336" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#57514b" text-anchor="start">88% · 3% churn</text><path d="M560 331C620 331 620 401 680 401" fill="none" stroke="#6b8f8a" stroke-width="2" stroke-opacity="0.8"/><rect x="680" y="370" width="220" height="62" rx="8" fill="#ffffff" stroke="#283d3b" stroke-width="1.4"/><text x="694" y="396" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="700" fill="#283d3b" text-anchor="start">Card declined</text><text x="694" y="416" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#57514b" text-anchor="start">12% · 21% churn</text><path d="M560 461C620 461 620 481 680 481" fill="none" stroke="#6b8f8a" stroke-width="2" stroke-opacity="0.8"/><rect x="680" y="450" width="220" height="62" rx="8" fill="#ffffff" stroke="#283d3b" stroke-width="1.4"/><text x="694" y="476" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="700" fill="#283d3b" text-anchor="start">Continued</text><text x="694" y="496" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#57514b" text-anchor="start">71% · 4% churn</text><path d="M560 461C620 461 620 571 680 571" fill="none" stroke="#6e2a2a" stroke-width="4" stroke-opacity="1"/><rect x="680" y="540" width="220" height="62" rx="8" fill="#6e2a2a" stroke="#6e2a2a" stroke-width="1.4"/><text x="694" y="566" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="start">Failed in IVR</text><text x="694" y="586" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#dbc9c9" text-anchor="start">29% · 38% churn</text><path d="M900 571C970 571 970 571 1040 571" fill="none" stroke="#6e2a2a" stroke-width="4" stroke-opacity="1"/><rect x="1040" y="540" width="300" height="62" rx="8" fill="#6e2a2a" stroke="#6e2a2a" stroke-width="1.4"/><text x="1054" y="566" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="start">No retry offered</text><text x="1054" y="586" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#dbc9c9" text-anchor="start">38% churn · target this path</text><path d="M1340 571C1360 571 1360 571 1376 571" fill="none" stroke="#6e2a2a" stroke-width="4" stroke-opacity="1"/><rect x="1040" y="300" width="300" height="168" rx="8" fill="#edddd4" stroke="#b69494" stroke-width="1"/><text x="1056" y="326" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#6e2a2a" text-anchor="start" letter-spacing="1.2">WHY IT MATTERS</text><text x="1056" y="354" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="700" fill="#283d3b" text-anchor="start">Top-up failures churn differently</text><text x="1056" y="374" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="700" fill="#283d3b" text-anchor="start">by channel. Mitigation targets</text><text x="1056" y="394" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="700" fill="#283d3b" text-anchor="start">the worst path, not every</text><text x="1056" y="414" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="700" fill="#283d3b" text-anchor="start">failure equally.</text><text x="1056" y="446" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#6e2a2a" text-anchor="start">IVR failure with no retry: 38%</text>
</svg>
