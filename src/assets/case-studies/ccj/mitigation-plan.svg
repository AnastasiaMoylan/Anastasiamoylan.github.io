  <title id="cj-plan-title">Mitigation plan</title>
  <desc id="cj-plan-desc">A mitigation plan for an at-risk KPI: the model's key drivers ranked, then an offer builder with audience, incentive, tone and channel controls, an assistant-drafted message preview a person has edited, and a Send for review action.</desc>
