<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Billing package status model</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f7f5f1;
      --color-ink:    #283d3b;
      --color-muted:  #6b6560;
      --color-accent: #6e2a2a;
      --font-sans:    'Inter', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">State machine · Auditable billing workflow</p>
    <h1>Billing package status model</h1>

    <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="status-model-title status-model-desc">
      <title id="status-model-title">Billing package status model</title>
      <desc id="status-model-desc">State machine showing a billing package moving from Initiated through In Progress, Review, Approved and Finalized to Completed, with a retry loop when a feeder system fails and a missing-evidence return from Review.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6b6560"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6e2a2a"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f7f5f1"/>

      <!-- Transitions (drawn first) -->
      <!-- Start → Initiated -->
      <line x1="68" y1="176" x2="120" y2="176" stroke="#6b6560" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Initiated → In Progress -->
      <line x1="280" y1="176" x2="360" y2="176" stroke="#6b6560" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- In Progress → Review (accent: the submission the KPI measures) -->
      <line x1="520" y1="176" x2="600" y2="176" stroke="#6e2a2a" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- In Progress self-loop: feeder failure, progress preserved, retry -->
      <path d="M 400 136 C 400 88, 480 88, 480 136" fill="none" stroke="#6b6560" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <!-- Review → In Progress: missing evidence stops the package before review -->
      <path d="M 652 216 C 652 264, 468 264, 468 216" fill="none" stroke="#6b6560" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <!-- Review → Approved: elbow down, across the row gap, down -->
      <path d="M 708 216 L 708 288 Q 708 296 700 296 L 208 296 Q 200 296 200 304 L 200 336" fill="none" stroke="#6b6560" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Approved → Finalized -->
      <line x1="280" y1="376" x2="360" y2="376" stroke="#6b6560" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Finalized → Completed -->
      <line x1="520" y1="376" x2="600" y2="376" stroke="#6b6560" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Completed → End -->
      <line x1="760" y1="376" x2="824" y2="376" stroke="#6b6560" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Transition labels (masked, 8px above the stroke) -->
      <rect x="74" y="156" width="40" height="12" rx="2" fill="#f7f5f1"/>
      <text x="94" y="166" fill="#6b6560" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">QUERY</text>

      <rect x="292" y="156" width="56" height="12" rx="2" fill="#f7f5f1"/>
      <text x="320" y="166" fill="#6b6560" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ASSEMBLE</text>

      <rect x="532" y="156" width="56" height="12" rx="2" fill="#f7f5f1"/>
      <text x="560" y="166" fill="#6e2a2a" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SUBMIT</text>

      <rect x="396" y="80" width="88" height="12" rx="2" fill="#f7f5f1"/>
      <text x="440" y="90" fill="#6b6560" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FAIL · RETRY</text>

      <rect x="516" y="260" width="88" height="12" rx="2" fill="#f7f5f1"/>
      <text x="560" y="270" fill="#6b6560" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NO EVIDENCE</text>

      <rect x="426" y="276" width="56" height="12" rx="2" fill="#f7f5f1"/>
      <text x="454" y="286" fill="#6b6560" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APPROVE</text>

      <rect x="292" y="356" width="56" height="12" rx="2" fill="#f7f5f1"/>
      <text x="320" y="366" fill="#6b6560" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FINALIZE</text>

      <rect x="532" y="356" width="56" height="12" rx="2" fill="#f7f5f1"/>
      <text x="560" y="366" fill="#6b6560" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">COMPLETE</text>

      <!-- Start dot -->
      <circle cx="60" cy="176" r="6" fill="#283d3b"/>

      <!-- State: Initiated -->
      <rect x="120" y="136" width="160" height="80" rx="8" fill="#f7f5f1"/>
      <rect x="120" y="136" width="160" height="80" rx="8" fill="#ffffff" stroke="#283d3b" stroke-width="1"/>
      <rect x="128" y="144" width="40" height="12" rx="2" fill="transparent" stroke="rgba(40,61,59,0.40)" stroke-width="0.8"/>
      <text x="148" y="153" fill="#283d3b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
      <text x="200" y="184" fill="#283d3b" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Initiated</text>
      <text x="200" y="200" fill="#6b6560" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">keyed to project no.</text>

      <!-- State: In Progress -->
      <rect x="360" y="136" width="160" height="80" rx="8" fill="#f7f5f1"/>
      <rect x="360" y="136" width="160" height="80" rx="8" fill="#ffffff" stroke="#283d3b" stroke-width="1"/>
      <rect x="368" y="144" width="40" height="12" rx="2" fill="transparent" stroke="rgba(40,61,59,0.40)" stroke-width="0.8"/>
      <text x="388" y="153" fill="#283d3b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
      <text x="440" y="184" fill="#283d3b" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">In Progress</text>
      <text x="440" y="200" fill="#6b6560" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">validation flags gaps</text>

      <!-- State: Review (focal: the state added as its own step) -->
      <rect x="600" y="136" width="160" height="80" rx="8" fill="#f7f5f1"/>
      <rect x="600" y="136" width="160" height="80" rx="8" fill="rgba(110,42,42,0.08)" stroke="#6e2a2a" stroke-width="1"/>
      <rect x="608" y="144" width="40" height="12" rx="2" fill="transparent" stroke="rgba(110,42,42,0.50)" stroke-width="0.8"/>
      <text x="628" y="153" fill="#6e2a2a" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
      <text x="680" y="184" fill="#283d3b" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Review</text>
      <text x="680" y="200" fill="#6b6560" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">others view-only</text>

      <!-- State: Approved -->
      <rect x="120" y="336" width="160" height="80" rx="8" fill="#f7f5f1"/>
      <rect x="120" y="336" width="160" height="80" rx="8" fill="#ffffff" stroke="#283d3b" stroke-width="1"/>
      <rect x="128" y="344" width="40" height="12" rx="2" fill="transparent" stroke="rgba(40,61,59,0.40)" stroke-width="0.8"/>
      <text x="148" y="353" fill="#283d3b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
      <text x="200" y="384" fill="#283d3b" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Approved</text>
      <text x="200" y="400" fill="#6b6560" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">commit message logged</text>

      <!-- State: Finalized -->
      <rect x="360" y="336" width="160" height="80" rx="8" fill="#f7f5f1"/>
      <rect x="360" y="336" width="160" height="80" rx="8" fill="#ffffff" stroke="#283d3b" stroke-width="1"/>
      <rect x="368" y="344" width="40" height="12" rx="2" fill="transparent" stroke="rgba(40,61,59,0.40)" stroke-width="0.8"/>
      <text x="388" y="353" fill="#283d3b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
      <text x="440" y="384" fill="#283d3b" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Finalized</text>
      <text x="440" y="400" fill="#6b6560" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">report + audit trail</text>

      <!-- State: Completed -->
      <rect x="600" y="336" width="160" height="80" rx="8" fill="#f7f5f1"/>
      <rect x="600" y="336" width="160" height="80" rx="8" fill="rgba(40,61,59,0.05)" stroke="#6b6560" stroke-width="1"/>
      <rect x="608" y="344" width="40" height="12" rx="2" fill="transparent" stroke="rgba(107,101,96,0.50)" stroke-width="0.8"/>
      <text x="628" y="353" fill="#6b6560" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
      <text x="680" y="384" fill="#283d3b" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Completed</text>
      <text x="680" y="400" fill="#6b6560" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">history retained</text>

      <!-- End ring -->
      <circle cx="840" cy="376" r="8" fill="none" stroke="#283d3b" stroke-width="1"/>
      <circle cx="840" cy="376" r="5" fill="#283d3b"/>

      <!-- Legend -->
      <line x1="40" y1="524" x2="920" y2="524" stroke="rgba(40,61,59,0.12)" stroke-width="0.8"/>
      <text x="40" y="544" fill="#6b6560" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="120" y="536" width="14" height="10" rx="2" fill="#ffffff" stroke="#283d3b" stroke-width="1"/>
      <text x="140" y="544" fill="#6b6560" font-size="9" font-family="'Inter', sans-serif">Package state</text>

      <rect x="248" y="536" width="14" height="10" rx="2" fill="rgba(110,42,42,0.08)" stroke="#6e2a2a" stroke-width="1"/>
      <text x="268" y="544" fill="#6b6560" font-size="9" font-family="'Inter', sans-serif">Review, made its own state</text>

      <line x1="440" y1="541" x2="468" y2="541" stroke="#6b6560" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="476" y="544" fill="#6b6560" font-size="9" font-family="'Inter', sans-serif">Transition, timestamped</text>

      <line x1="640" y1="541" x2="668" y2="541" stroke="#6b6560" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="676" y="544" fill="#6b6560" font-size="9" font-family="'Inter', sans-serif">Recovery loop, progress kept</text>
    </svg>
  </div>
</body>
</html>
