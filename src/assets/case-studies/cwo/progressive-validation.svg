  <title id="bw-valid-title">Progressive validation</title>
  <desc id="bw-valid-desc">Step two of creating a billing package: a banner says screenshot generation failed for one project and progress is saved, with a Retry action; four project rows validate inline, one with evidence pending and one whose project number was not found; and a completeness review below runs before submission.</desc>
