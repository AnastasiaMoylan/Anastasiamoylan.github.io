<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="scope-ownership-title scope-ownership-desc">
      <title id="scope-ownership-title">Scope and ownership on the billing workflow</title>
      <desc id="scope-ownership-desc">Four widening bands of involvement on the billing workflow. At the core, what I owned outright: product definition and scope, the ten-stage decomposition and status model, and development-ready flows with error-condition wireframes. Around it, what I led: requirements workshops, prioritization, and moderated usability research. Beyond that, what I influenced outside the design lane: backlogs, roadmaps, test plans, decision logs, quality gates, and the scope calls on the dashboard and the interim editing path. The outermost band is the team the work sat inside.</desc><defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style></defs>

      <rect width="100%" height="100%" fill="#f7f5f1"/>

      <!-- Band 4 — Worked with (outermost, faintest) -->
      <rect x="24" y="24" width="912" height="472" rx="8" fill="#f7f5f1"/>
      <rect x="24" y="24" width="912" height="472" rx="8" fill="#283d3b" fill-opacity="0.015" stroke="#283d3b" stroke-opacity="0.30" stroke-width="1"/>

      <!-- Band 3 — Influenced beyond the design lane -->
      <rect x="56" y="92" width="848" height="380" rx="8" fill="#f7f5f1"/>
      <rect x="56" y="92" width="848" height="380" rx="8" fill="#283d3b" fill-opacity="0.025" stroke="#283d3b" stroke-opacity="0.45" stroke-width="1"/>

      <!-- Band 2 — Led -->
      <rect x="88" y="160" width="784" height="288" rx="8" fill="#f7f5f1"/>
      <rect x="88" y="160" width="784" height="288" rx="8" fill="#283d3b" fill-opacity="0.04" stroke="#6b6560" stroke-width="1"/>

      <!-- Band 1 — Owned (focal) -->
      <rect x="120" y="228" width="720" height="196" rx="8" fill="#f7f5f1"/>
      <rect x="120" y="228" width="720" height="196" rx="8" fill="#6e2a2a" fill-opacity="0.08" stroke="#6e2a2a" stroke-width="1"/>

      <!-- Band labels, masked over each band's top border -->
      <rect x="40" y="17" width="76" height="14" fill="#f7f5f1"/>
      <text x="48" y="27" fill="#8f8a83" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">WORKED WITH</text>

      <rect x="72" y="85" width="208" height="14" fill="#f7f5f1"/>
      <text x="80" y="95" fill="#6b6560" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">INFLUENCED BEYOND THE DESIGN LANE</text>

      <rect x="104" y="153" width="32" height="14" fill="#f7f5f1"/>
      <text x="112" y="163" fill="#283d3b" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LED</text>

      <rect x="136" y="221" width="48" height="14" fill="#f7f5f1"/>
      <text x="144" y="231" fill="#6e2a2a" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" letter-spacing="0.14em">OWNED</text>

      <!-- Band 4 content -->
      <text x="48" y="56" fill="#8f8a83" font-size="9" font-family="'Geist Mono', monospace">CWO team · Client Chief Data Office · Data team lead</text>
      <text x="48" y="72" fill="#8f8a83" font-size="9" font-family="'Geist Mono', monospace">Product · Engineering · UI development · Finance and operations · A consulting principal designer</text>

      <!-- Band 3 content -->
      <text x="80" y="124" fill="#6b6560" font-size="9" font-family="'Geist Mono', monospace">Prioritized backlogs · Roadmaps · Test plans · Acceptance criteria</text>
      <text x="80" y="140" fill="#6b6560" font-size="9" font-family="'Geist Mono', monospace">Decision logs · Quality gates · Risk documentation · Scope calls on the dashboard and the interim editing path</text>

      <!-- Band 2 content -->
      <text x="112" y="192" fill="#283d3b" font-size="9" font-family="'Geist Mono', monospace">Requirements workshops and discovery · Must / Should / Nice-to-have option sets</text>
      <text x="112" y="208" fill="#283d3b" font-size="9" font-family="'Geist Mono', monospace">Moderated usability research, ten participants across three user groups · Delivery syncs with engineering</text>

      <!-- Band 1 content — the three things that are mine outright -->
      <rect x="144" y="288" width="208" height="72" rx="6" fill="#ffffff" stroke="#283d3b" stroke-width="1"/>
      <text x="248" y="320" fill="#283d3b" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Product definition</text>
      <text x="248" y="338" fill="#283d3b" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">and scope</text>

      <rect x="376" y="288" width="208" height="72" rx="6" fill="#ffffff" stroke="#283d3b" stroke-width="1"/>
      <text x="480" y="320" fill="#283d3b" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Ten-stage decomposition</text>
      <text x="480" y="338" fill="#283d3b" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">and the status model</text>

      <rect x="608" y="288" width="208" height="72" rx="6" fill="#ffffff" stroke="#283d3b" stroke-width="1"/>
      <text x="712" y="320" fill="#283d3b" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Development-ready flows</text>
      <text x="712" y="338" fill="#283d3b" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">and error-condition wireframes</text>

      <text x="480" y="392" fill="#6e2a2a" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Front end designed · Design handoff run · Design backlog maintained</text>

      <!-- Editorial callout, bottom margin -->
      <text x="24" y="548" fill="#283d3b" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">The approval flow designed here has since been picked up by other projects.</text>
      <path d="M 496 540 Q 560 520 592 476" fill="none" stroke="#283d3b" stroke-opacity="0.40" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="592" cy="472" r="2" fill="#283d3b"/>
    </svg>