<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1440 720" width="1440" height="720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bw-review-title bw-review-desc">
  <title id="bw-review-title">Review flow</title>
  <desc id="bw-review-desc">Flow: opening a billing package checks whether a review is active. If someone else is reviewing, the package is view only until the review ends. Otherwise the reviewer starts the review, the status moves to Review and locks to that reviewer, inline edits each save a history entry, and completing the review either approves the package or returns it to In Progress with a recorded reason.</desc>
  <defs>
    <filter id="bw-review-shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.14"/></filter>
    <pattern id="bw-review-grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="rgba(40,61,59,0.06)" stroke-width="1"/></pattern>
    <marker id="bw-review-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#6b7f99"/></marker>
    <marker id="bw-review-arrow-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#0f7fa3"/></marker>
    <marker id="bw-review-arrow-r" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#dbc9c9"/></marker>
  </defs>
  <rect width="1440" height="720" fill="#edddd4"/>
  
<text x="48" y="40" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#46596f" text-anchor="start" letter-spacing="1.2">REVIEWER</text><text x="48" y="470" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#46596f" text-anchor="start" letter-spacing="1.2">EVERYONE ELSE</text><path d="M48 440H1392" stroke="#d5dbe3" stroke-dasharray="6 6"/><rect x="48" y="120" width="200" height="64" rx="8" fill="#ffffff" stroke="#1b2433" stroke-width="1.4"/><text x="148" y="150" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="600" fill="#1b2433" text-anchor="middle">Open billing package</text><text x="148" y="168" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#5c6675" text-anchor="middle">Any role</text><path d="M400 104L500 152L400 200L300 152Z" fill="#d9eef4" stroke="#1b2433" stroke-width="1.4"/><text x="400" y="157" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="600" fill="#1b2433" text-anchor="middle">Review active?</text><rect x="552" y="120" width="200" height="64" rx="8" fill="#ffffff" stroke="#1b2433" stroke-width="1.4"/><text x="652" y="150" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="600" fill="#1b2433" text-anchor="middle">Start review</text><text x="652" y="168" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#5c6675" text-anchor="middle">Reviewer set to me</text><rect x="804" y="120" width="200" height="64" rx="32" fill="#0f7fa3" stroke="#0f7fa3" stroke-width="1"/><text x="904" y="150" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">Status · Review</text><text x="904" y="168" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#dbc9c9" text-anchor="middle">Locked to one reviewer</text><rect x="1056" y="120" width="220" height="64" rx="8" fill="#ffffff" stroke="#1b2433" stroke-width="1.4"/><text x="1166" y="150" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="600" fill="#1b2433" text-anchor="middle">Inline edit</text><text x="1166" y="168" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#5c6675" text-anchor="middle">Field by field</text><rect x="1056" y="260" width="220" height="64" rx="8" fill="#ffffff" stroke="#1b2433" stroke-width="1.4"/><text x="1166" y="290" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="600" fill="#1b2433" text-anchor="middle">Save · history entry</text><text x="1166" y="308" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#5c6675" text-anchor="middle">Who, what, when</text><rect x="804" y="260" width="200" height="64" rx="8" fill="#ffffff" stroke="#1b2433" stroke-width="1.4"/><text x="904" y="297" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="600" fill="#1b2433" text-anchor="middle">Complete review</text><rect x="552" y="340" width="200" height="64" rx="8" fill="#1b2433" stroke="#283d3b" stroke-width="1"/><text x="652" y="377" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">Status · Approved</text><rect x="48" y="340" width="200" height="64" rx="8" fill="#ffffff" stroke="#1b2433" stroke-width="1.4"/><text x="148" y="370" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="600" fill="#1b2433" text-anchor="middle">Return · In Progress</text><text x="148" y="388" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#5c6675" text-anchor="middle">With a recorded reason</text><rect x="580" y="520" width="200" height="64" rx="8" fill="#ffffff" stroke="#1b2433" stroke-width="1.4"/><text x="680" y="550" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="600" fill="#1b2433" text-anchor="middle">View only</text><text x="680" y="568" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#5c6675" text-anchor="middle">Until the review ends</text><path d="M400 512L520 552L400 592L280 552Z" fill="#d9eef4" stroke="#1b2433" stroke-width="1.4"/><text x="400" y="557" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="600" fill="#1b2433" text-anchor="middle">Someone else reviewing?</text><path d="M248 152H300" fill="none" stroke="#6b7f99" stroke-width="1.6" marker-end="url(#bw-review-arrow)"/><path d="M500 152H552" fill="none" stroke="#6b7f99" stroke-width="1.6" marker-end="url(#bw-review-arrow)"/><rect x="513.18" y="128" width="25.64" height="18" rx="3" fill="#f3f5f8"/><text x="526" y="141" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11" font-weight="600" fill="#46596f" text-anchor="middle" letter-spacing="1">NO</text><path d="M752 152H804" fill="none" stroke="#6b7f99" stroke-width="1.6" marker-end="url(#bw-review-arrow)"/><path d="M1004 152H1056" fill="none" stroke="#0f7fa3" stroke-width="1.6" marker-end="url(#bw-review-arrow-m)"/><path d="M1166 184V260" fill="none" stroke="#0f7fa3" stroke-width="1.6" marker-end="url(#bw-review-arrow-m)"/><path d="M1056 292H1004" fill="none" stroke="#0f7fa3" stroke-width="1.6" marker-end="url(#bw-review-arrow-m)"/><path d="M1276 292Q1320 292 1320 220Q1320 152 1276 152" fill="none" stroke="#0f7fa3" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#bw-review-arrow-m)"/><rect x="1310.36" y="212" width="39.28" height="18" rx="3" fill="#f3f5f8"/><text x="1330" y="225" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11" font-weight="600" fill="#0f7fa3" text-anchor="middle" letter-spacing="1">LOOP</text><path d="M904 324V372H752" fill="none" stroke="#6b7f99" stroke-width="1.6" marker-end="url(#bw-review-arrow)"/><rect x="798.13" y="390" width="59.74" height="18" rx="3" fill="#f3f5f8"/><text x="828" y="403" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11" font-weight="600" fill="#46596f" text-anchor="middle" letter-spacing="1">APPROVE</text><path d="M804 292H160Q148 292 148 304V340" fill="none" stroke="#6b7f99" stroke-width="1.6" marker-end="url(#bw-review-arrow)"/><rect x="593.54" y="268" width="52.92" height="18" rx="3" fill="#f3f5f8"/><text x="620" y="281" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11" font-weight="600" fill="#46596f" text-anchor="middle" letter-spacing="1">RETURN</text><path d="M400 200V512" fill="none" stroke="#6b7f99" stroke-width="1.6" marker-end="url(#bw-review-arrow)"/><rect x="383.77" y="350" width="32.46" height="18" rx="3" fill="#f3f5f8"/><text x="400" y="363" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11" font-weight="600" fill="#46596f" text-anchor="middle" letter-spacing="1">YES</text><path d="M520 552H580" fill="none" stroke="#6b7f99" stroke-width="1.6" marker-end="url(#bw-review-arrow)"/><rect x="533.77" y="528" width="32.46" height="18" rx="3" fill="#f3f5f8"/><text x="550" y="541" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11" font-weight="600" fill="#46596f" text-anchor="middle" letter-spacing="1">YES</text><path d="M400 592Q400 650 300 650Q248 650 248 610V184" fill="none" stroke="#6b7f99" stroke-width="1.6" marker-end="url(#bw-review-arrow)"/><rect x="283.08" y="658" width="93.84" height="18" rx="3" fill="#f3f5f8"/><text x="330" y="671" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11" font-weight="600" fill="#46596f" text-anchor="middle" letter-spacing="1">NO, IT IS ME</text><path d="M680 520Q680 480 700 480H900Q904 480 904 324" fill="none" stroke="#6b7f99" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#bw-review-arrow)"/><rect x="756.49" y="458" width="87.02" height="18" rx="3" fill="#f3f5f8"/><text x="800" y="471" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="