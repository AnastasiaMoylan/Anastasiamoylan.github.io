<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="di-cite-title di-cite-desc">
      <title id="di-cite-title">A citation is navigation, not decoration</title>
      <desc id="di-cite-desc">A three-stage loop. A generated statement carries numbered citation chips. Opening the Sources control lists the documents behind the answer, each item opening in the embedded viewer or in a new tab. Opening a source narrows the chat context to that one document, so the answer and its evidence are read together. Closing the source widens the context back to the broader conversation, which returns the user to the statement they started from without losing their place. A note below records the rejected alternative: a citation footer at the end of a response, which satisfies an audit requirement but makes checking a source a separate task.</desc><defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style></defs>

      <rect width="100%" height="100%" fill="#f7f5f1"/>

      <text x="24" y="56" fill="#6b6560" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">EVERY GENERATED STATEMENT, EVERY ANSWER</text>

      <!-- Stage 1 — the generated statement -->
      <rect x="24" y="128" width="264" height="160" rx="6" fill="#ffffff" stroke="#283d3b" stroke-width="1"/>
      <text x="156" y="164" fill="#283d3b" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Generated statement</text>
      <rect x="48" y="184" width="216" height="8" rx="3" fill="#283d3b" fill-opacity="0.08"/>
      <rect x="48" y="200" width="216" height="8" rx="3" fill="#283d3b" fill-opacity="0.08"/>
      <rect x="48" y="216" width="152" height="8" rx="3" fill="#283d3b" fill-opacity="0.08"/>
      <rect x="208" y="212" width="16" height="16" rx="3" fill="#6e2a2a" fill-opacity="0.08" stroke="#6e2a2a" stroke-width="0.8"/>
      <text x="216" y="223" fill="#6e2a2a" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>
      <rect x="228" y="212" width="16" height="16" rx="3" fill="#6e2a2a" fill-opacity="0.08" stroke="#6e2a2a" stroke-width="0.8"/>
      <text x="236" y="223" fill="#6e2a2a" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">2</text>
      <rect x="248" y="212" width="16" height="16" rx="3" fill="#6e2a2a" fill-opacity="0.08" stroke="#6e2a2a" stroke-width="0.8"/>
      <text x="256" y="223" fill="#6e2a2a" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">3</text>
      <text x="156" y="256" fill="#6b6560" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Numbered citation chips, inline</text>
      <text x="156" y="272" fill="#6b6560" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Not a footer at the end</text>

      <path d="M 288 208 L 340 208" fill="none" stroke="#6b6560" stroke-width="1"/>
      <path d="M 340 208 l -6 -3.5 v 7 z" fill="#6b6560"/>
      <rect x="292" y="176" width="48" height="14" fill="#f7f5f1"/>
      <text x="296" y="186" fill="#283d3b" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">OPEN</text>

      <!-- Stage 2 — the sources control -->
      <rect x="344" y="128" width="264" height="160" rx="6" fill="#ffffff" stroke="#283d3b" stroke-width="1"/>
      <text x="476" y="164" fill="#283d3b" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Sources</text>
      <rect x="368" y="180" width="216" height="24" rx="4" fill="#283d3b" fill-opacity="0.04" stroke="#283d3b" stroke-opacity="0.20" stroke-width="0.8"/>
      <rect x="368" y="208" width="216" height="24" rx="4" fill="#283d3b" fill-opacity="0.04" stroke="#283d3b" stroke-opacity="0.20" stroke-width="0.8"/>
      <rect x="368" y="236" width="216" height="24" rx="4" fill="#283d3b" fill-opacity="0.04" stroke="#283d3b" stroke-opacity="0.20" stroke-width="0.8"/>
      <text x="476" y="280" fill="#6b6560" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Default · hover · active · focus states</text>

      <path d="M 608 208 L 660 208" fill="none" stroke="#6b6560" stroke-width="1"/>
      <path d="M 660 208 l -6 -3.5 v 7 z" fill="#6b6560"/>
      <rect x="608" y="176" width="60" height="14" fill="#f7f5f1"/>
      <text x="612" y="186" fill="#283d3b" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">SELECT</text>

      <!-- Stage 3 — the embedded viewer (focal) -->
      <rect x="664" y="128" width="272" height="160" rx="6" fill="#6e2a2a" fill-opacity="0.08" stroke="#6e2a2a" stroke-width="1.2"/>
      <text x="800" y="164" fill="#6e2a2a" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Embedded viewer</text>
      <rect x="688" y="180" width="224" height="72" rx="4" fill="#ffffff" stroke="#6e2a2a" stroke-opacity="0.45" stroke-width="0.8"/>
      <rect x="704" y="196" width="192" height="6" rx="2" fill="#283d3b" fill-opacity="0.10"/>
      <rect x="704" y="208" width="192" height="6" rx="2" fill="#6e2a2a" fill-opacity="0.22"/>
      <rect x="704" y="220" width="192" height="6" rx="2" fill="#283d3b" fill-opacity="0.10"/>
      <rect x="704" y="232" width="128" height="6" rx="2" fill="#283d3b" fill-opacity="0.10"/>
      <text x="800" y="272" fill="#6e2a2a" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">CHAT CONTEXT NARROWS TO THIS DOCUMENT</text>

      <!-- The return leg -->
      <path d="M 800 288 C 800 384 156 384 156 296" fill="none" stroke="#6b6560" stroke-width="1" stroke-dasharray="5,4"/>
      <path d="M 156 292 l -3.5 6 h 7 z" fill="#6b6560"/>
      <rect x="332" y="368" width="304" height="16" fill="#f7f5f1"/>
      <text x="480" y="380" fill="#283d3b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">CLOSE THE SOURCE · CONTEXT WIDENS BACK</text>

      <!-- Editorial callout -->
      <text x="24" y="440" fill="#283d3b" font-size="16" font-style="italic" font-family="'Instrument Serif', serif">If verification costs the user their place in the conversation, they stop verifying.</text>

      <!-- The rejected path -->
      <rect x="24" y="480" width="912" height="80" rx="6" fill="#283d3b" fill-opacity="0.02" stroke="#283d3b" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="48" y="508" fill="#8f8a83" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">REJECTED</text>
      <text x="48" y="530" fill="#6b6560" font-size="11" font-family="'Inter', sans-serif">A citation footer listing sources at the end of a response.</text>
      <text x="48" y="548" fill="#8f8a83" font-size="9" font-family="'Geist Mono', monospace">It satisfies the audit requirement and makes checking a source a separate task rather than a continuation of the current one.</text>
    </svg>