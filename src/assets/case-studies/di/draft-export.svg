<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1440 900" width="1440" height="900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="da-draft-title da-draft-desc">
  <title id="da-draft-title">Draft beside the conversation</title>
  <desc id="da-draft-desc">A focus-mode draft on the right with numbered sections, each carrying a citation mark, and the conversation still open on the left. An export bar writes a versioned Word file with the citations kept as footnotes into the enterprise document store.</desc>
  <defs>
    <filter id="da-draft-shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/></filter>
    <pattern id="da-draft-grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="rgba(237,221,212,0.06)" stroke-width="1"/></pattern>
    <marker id="da-draft-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#6b7f99"/></marker>
    <marker id="da-draft-arrow-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#6d3fc4"/></marker>
    <marker id="da-draft-arrow-r" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#dbc9c9"/></marker>
  </defs>
  <rect width="1440" height="900" fill="#1d2d2b"/>
  
