<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="di-compare-title di-compare-desc">
      <title id="di-compare-title">Comparison mode is bound to the selection count</title>
      <desc id="di-compare-desc">A branch diagram. A user selects between two and ten documents, which appear as chips beside the prompt and stay deselectable until submission. The selection count, not a user preference, decides the mode. Exactly two documents open a side-by-side diff that highlights shared and differing content section by section. Three to ten documents open a comparison table whose rows are themes or entities and whose columns are documents. A note records the rejected alternative: one universal comparison view that scaled to any number of documents.</desc><defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style></defs>

      <rect width="100%" height="100%" fill="#f7f5f1"/>

      <!-- Stage 1 — the selection -->
      <rect x="24" y="216" width="216" height="128" rx="6" fill="#ffffff" stroke="#283d3b" stroke-width="1"/>
      <text x="132" y="250" fill="#283d3b" font-size="13" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Documents selected</text>
      <rect x="44" y="268" width="52" height="20" rx="4" fill="#283d3b" fill-opacity="0.06" stroke="#283d3b" stroke-opacity="0.30" stroke-width="0.8"/>
      <rect x="104" y="268" width="52" height="20" rx="4" fill="#283d3b" fill-opacity="0.06" stroke="#283d3b" stroke-opacity="0.30" stroke-width="0.8"/>
      <rect x="164" y="268" width="52" height="20" rx="4" fill="#283d3b" fill-opacity="0.06" stroke="#283d3b" stroke-opacity="0.30" stroke-width="0.8"/>
      <text x="132" y="310" fill="#6b6560" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Chips beside the prompt</text>
      <text x="132" y="326" fill="#6b6560" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">2–10 required · editable until submit</text>

      <path d="M 240 280 L 292 280" fill="none" stroke="#6b6560" stroke-width="1"/>
      <path d="M 292 280 l -6 -3.5 v 7 z" fill="#6b6560"/>

      <!-- Stage 2 — the binding rule (focal) -->
      <rect x="296" y="232" width="168" height="96" rx="6" fill="#6e2a2a" fill-opacity="0.08" stroke="#6e2a2a" stroke-width="1.2"/>
      <text x="380" y="268" fill="#6e2a2a" font-size="13" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">The count decides</text>
      <text x="380" y="292" fill="#6e2a2a" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">NOT A MODE TOGGLE</text>
      <text x="380" y="308" fill="#6e2a2a" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">NOT A USER PREFERENCE</text>

      <!-- Branch to the two-document mode -->
      <path d="M 464 260 C 508 260 508 172 552 172" fill="none" stroke="#6b6560" stroke-width="1"/>
      <path d="M 552 172 l -6 -3.5 v 7 z" fill="#6b6560"/>
      <rect x="472" y="192" width="68" height="14" fill="#f7f5f1"/>
      <text x="478" y="202" fill="#283d3b" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">EXACTLY 2</text>

      <!-- Branch to the many-document mode -->
      <path d="M 464 300 C 508 300 508 412 552 412" fill="none" stroke="#6b6560" stroke-width="1"/>
      <path d="M 552 412 l -6 -3.5 v 7 z" fill="#6b6560"/>
      <rect x="472" y="368" width="60" height="14" fill="#f7f5f1"/>
      <text x="478" y="378" fill="#283d3b" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">3 TO 10</text>

      <!-- Mode A — side-by-side diff -->
      <rect x="556" y="88" width="380" height="168" rx="6" fill="#ffffff" stroke="#283d3b" stroke-width="1"/>
      <text x="576" y="116" fill="#283d3b" font-size="13" font-weight="600" font-family="'Inter', sans-serif">Side-by-side diff</text>
      <text x="576" y="134" fill="#6b6560" font-size="9" font-family="'Geist Mono', monospace">Shared and differing content, section by section</text>

      <rect x="576" y="148" width="164" height="16" rx="3" fill="#283d3b" fill-opacity="0.08"/>
      <rect x="752" y="148" width="164" height="16" rx="3" fill="#283d3b" fill-opacity="0.08"/>
      <rect x="576" y="170" width="164" height="16" rx="3" fill="#ffffff" stroke="#283d3b" stroke-opacity="0.35" stroke-width="0.8" stroke-dasharray="4,3"/>
      <rect x="752" y="170" width="164" height="16" rx="3" fill="#ffffff" stroke="#283d3b" stroke-opacity="0.35" stroke-width="0.8" stroke-dasharray="4,3"/>
      <rect x="576" y="192" width="164" height="16" rx="3" fill="#283d3b" fill-opacity="0.08"/>
      <rect x="752" y="192" width="164" height="16" rx="3" fill="#283d3b" fill-opacity="0.08"/>
      <rect x="576" y="214" width="164" height="16" rx="3" fill="#ffffff" stroke="#283d3b" stroke-opacity="0.35" stroke-width="0.8" stroke-dasharray="4,3"/>
      <rect x="752" y="214" width="164" height="16" rx="3" fill="#ffffff" stroke="#283d3b" stroke-opacity="0.35" stroke-width="0.8" stroke-dasharray="4,3"/>

      <rect x="576" y="240" width="12" height="8" rx="2" fill="#283d3b" fill-opacity="0.08"/>
      <text x="594" y="247" fill="#8f8a83" font-size="8" font-family="'Geist Mono', monospace">SHARED</text>
      <rect x="656" y="240" width="12" height="8" rx="2" fill="#ffffff" stroke="#283d3b" stroke-opacity="0.35" stroke-width="0.8" stroke-dasharray="3,2"/>
      <text x="674" y="247" fill="#8f8a83" font-size="8" font-family="'Geist Mono', monospace">DIFFERS</text>
      <text x="752" y="247" fill="#8f8a83" font-size="8" font-family="'Geist Mono', monospace">TWO DOCUMENTS INVITE READING</text>

      <!-- Mode B — comparison table -->
      <rect x="556" y="328" width="380" height="168" rx="6" fill="#ffffff" stroke="#283d3b" stroke-width="1"/>
      <text x="576" y="356" fill="#283d3b" font-size="13" font-weight="600" font-family="'Inter', sans-serif">Comparison table</text>
      <text x="576" y="374" fill="#6b6560" font-size="9" font-family="'Geist Mono', monospace">Rows are themes or entities · columns are documents</text>

      <rect x="576" y="388" width="104" height="18" rx="3" fill="#283d3b" fill-opacity="0.10"/>
      <rect x="688" y="388" width="72" height="18" rx="3" fill="#283d3b" fill-opacity="0.10"/>
      <rect x="768" y="388" width="72" height="18" rx="3" fill="#283d3b" fill-opacity="0.10"/>
      <rect x="848" y="388" width="68" height="18" rx="3" fill="#283d3b" fill-opacity="0.10"/>

      <rect x="576" y="412" width="104" height="18" rx="3" fill="#283d3b" fill-opacity="0.04"/>
      <rect x="688" y="412" width="72" height="18" rx="3" fill="#ffffff" stroke="#283d3b" stroke-opacity="0.20" stroke-width="0.8"/>
      <rect x="768" y="412" width="72" height="18" rx="3" fill="#ffffff" stroke="#283d3b" stroke-opacity="0.20" stroke-width="0.8"/>
      <rect x="848" y="412" width="68" height="18" rx="3" fill="#ffffff" stroke="#283d3b" stroke-opacity="0.20" stroke-width="0.8"/>

      <rect x="576" y="436" width="104" height="18" rx="3" fill="#283d3b" fill-opacity="0.04"/>
      <rect x="688" y="436" width="72" height="18" rx="3" fill="#ffffff" stroke="#283d3b" stroke-opacity="0.20" stroke-width="0.8"/>
      <rect x="768" y="436" width="72" height="18" rx="3" fill="#ffffff" stroke="#283d3b" stroke-opacity="0.20" stroke-width="0.8"/>
      <rect x="848" y="436" width="68" height="18" rx="3" fill="#ffffff" stroke="#283d3b" stroke-opacity="0.20" stroke-width="0.8"/>

      <rect x="576" y="460" width="104" height="18" rx="3" fill="#283d3b" fill-opacity="0.04"/>
      <rect x="688" y="460" width="72" height="18" rx="3" fill="#ffffff" stroke="#283d3b" stroke-opacity="0.20" stroke-width="0.8"/>
      <rect x="768" y="460" width="72" height="18" rx="3" fill="#ffffff" stroke="#283d3b" stroke-opacity="0.20" stroke-width="0.8"/>
      <rect x="848" y="460" width="68" height="18" rx="3" fill="#ffffff" stroke="#283d3b" stroke-opacity="0.20" stroke-width="0.8"/>

      <text x="576" y="490" fill="#8f8a83" font-size="8" font-family="'Geist Mono', monospace">FIVE INVITE SCANNING — A NORMALIZED GRID IS THE ONLY READABLE FORM</text>

      <!-- Subject line and the editorial callout, top left -->
      <text x="24" y="100" fill="#6b6560" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">MULTI-DOCUMENT COMPARISON</text>
      <text x="24" y="136" fill="#283d3b" font-size="16" font-style="italic" font-family="'Instrument Serif', serif">Two documents and five documents</text>
      <text x="24" y="160" fill="#283d3b" font-size="16" font-style="italic" font-family="'Instrument Serif', serif">are different reading tasks.</text>
      <path d="M 268 152 Q 348 168 380 224" fill="none" stroke="#283d3b" stroke-opacity="0.40" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="380" cy="228" r="2" fill="#283d3b"/>

      <!-- The rejected path -->
      <text x="24" y="424" fill="#8f8a83" font-size="9" font-family="'Geist Mono', monospace">Rejected: one universal</text>
      <text x="24" y="440" fill="#8f8a83" font-size="9" font-family="'Geist Mono', monospace">comparison view that scaled</text>
      <text x="24" y="456" fill="#8f8a83" font-size="9" font-family="'Geist Mono', monospace">to any number of documents.</text>
      <text x="24" y="480" fill="#8f8a83" font-size="9" font-family="'Geist Mono', monospace">Cheaper to build, and it would</text>
      <text x="24" y="496" fill="#8f8a83" font-size="9" font-family="'Geist Mono', monospace">have made the commonest case</text>
      <text x="24" y="512" fill="#8f8a83" font-size="9" font-family="'Geist Mono', monospace">— two documents — worse.</text>
    </svg>