<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scope and ownership on the document AI platform</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f7f5f1;
      --color-ink:    #283d3b;
      --color-muted:  #6b6560;
      --color-accent: #6e2a2a;
      --font-sans:    'Inter', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Scope and ownership · Verifiable document AI</p>
    <h1>What I owned, led, and influenced</h1>

    <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="di-scope-title di-scope-desc">
      <title id="di-scope-title">Scope and ownership on the document AI platform</title>
      <desc id="di-scope-desc">Four widening bands of involvement on the document AI platform. At the core, what I owned outright: the region-based layout across five breakpoints, citations, sources and the embedded viewer, and document selection, comparison, drafting and export — with the UX acceptance criteria engineering built against and the accessibility documentation written into the design source of truth. Around it, what I led: requirements and prioritization workshops, research planning, protocol development and synthesis, and living backlogs across two products. Beyond that, what I influenced outside the design lane: the Must, Should and Nice-to-have tiers with dated commitments, the compliance tool framed as a widget on shared rails, and the mandatory response template for comparison answers. The outermost band is the team the work sat inside. A note below records what I did not own: the model, the retrieval stack, and the data-source procurement.</desc>

      <rect width="100%" height="100%" fill="#f7f5f1"/>

      <!-- Band 4 — Worked with (outermost, faintest) -->
      <rect x="24" y="24" width="912" height="472" rx="8" fill="#f7f5f1"/>
      <rect x="24" y="24" width="912" height="472" rx="8" fill="rgba(40,61,59,0.015)" stroke="rgba(40,61,59,0.30)" stroke-width="1"/>

      <!-- Band 3 — Influenced beyond the design lane -->
      <rect x="56" y="92" width="848" height="380" rx="8" fill="#f7f5f1"/>
      <rect x="56" y="92" width="848" height="380" rx="8" fill="rgba(40,61,59,0.025)" stroke="rgba(40,61,59,0.45)" stroke-width="1"/>

      <!-- Band 2 — Led -->
      <rect x="88" y="160" width="784" height="288" rx="8" fill="#f7f5f1"/>
      <rect x="88" y="160" width="784" height="288" rx="8" fill="rgba(40,61,59,0.04)" stroke="#6b6560" stroke-width="1"/>

      <!-- Band 1 — Owned (focal) -->
      <rect x="120" y="228" width="720" height="196" rx="8" fill="#f7f5f1"/>
      <rect x="120" y="228" width="720" height="196" rx="8" fill="rgba(110,42,42,0.08)" stroke="#6e2a2a" stroke-width="1"/>

      <!-- Band labels, masked over each band's top border -->
      <rect x="40" y="17" width="76" height="14" fill="#f7f5f1"/>
      <text x="48" y="27" fill="#8f8a83" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">WORKED WITH</text>

      <rect x="72" y="85" width="208" height="14" fill="#f7f5f1"/>
      <text x="80" y="95" fill="#6b6560" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">INFLUENCED BEYOND THE DESIGN LANE</text>

      <rect x="104" y="153" width="32" height="14" fill="#f7f5f1"/>
      <text x="112" y="163" fill="#283d3b" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LED</text>

      <rect x="136" y="221" width="48" height="14" fill="#f7f5f1"/>
      <text x="144" y="231" fill="#6e2a2a" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" letter-spacing="0.14em">OWNED</text>

      <!-- Band 4 content -->
      <text x="48" y="56" fill="#8f8a83" font-size="9" font-family="'Geist Mono', monospace">Design · Product · Engineering · Research · Client stakeholders</text>
      <text x="48" y="72" fill="#8f8a83" font-size="9" font-family="'Geist Mono', monospace">Federated engineering resources shared with other use cases, across two or more time zones</text>

      <!-- Band 3 content -->
      <text x="80" y="124" fill="#6b6560" font-size="9" font-family="'Geist Mono', monospace">Must / Should / Nice-to-have tiers with dated commitments</text>
      <text x="80" y="140" fill="#6b6560" font-size="9" font-family="'Geist Mono', monospace">The compliance tool framed as a widget on shared rails · The mandatory response template for comparison answers</text>

      <!-- Band 2 content -->
      <text x="112" y="192" fill="#283d3b" font-size="9" font-family="'Geist Mono', monospace">Requirements and prioritization workshops with product, engineering, and client stakeholders</text>
      <text x="112" y="208" fill="#283d3b" font-size="9" font-family="'Geist Mono', monospace">Research planning, protocol development, and synthesis · Living backlogs across two products</text>

      <!-- Band 1 content — the three things that are mine outright -->
      <rect x="144" y="288" width="208" height="72" rx="6" fill="#ffffff" stroke="#283d3b" stroke-width="1"/>
      <text x="248" y="320" fill="#283d3b" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Region-based layout,</text>
      <text x="248" y="338" fill="#283d3b" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">five breakpoints</text>

      <rect x="376" y="288" width="208" height="72" rx="6" fill="#ffffff" stroke="#283d3b" stroke-width="1"/>
      <text x="480" y="320" fill="#283d3b" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Citations, sources, and</text>
      <text x="480" y="338" fill="#283d3b" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">the embedded viewer</text>

      <rect x="608" y="288" width="208" height="72" rx="6" fill="#ffffff" stroke="#283d3b" stroke-width="1"/>
      <text x="712" y="320" fill="#283d3b" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Selection, comparison,</text>
      <text x="712" y="338" fill="#283d3b" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">drafting, and export</text>

      <text x="480" y="392" fill="#6e2a2a" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">UX acceptance criteria written · Accessibility documented in the design source of truth</text>

      <!-- Editorial callout, bottom margin -->
      <text x="24" y="540" fill="#283d3b" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">The compliance tool shipped as a widget on shared rails, not as its own product.</text>
      <path d="M 444 532 Q 540 516 592 476" fill="none" stroke="rgba(40,61,59,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="592" cy="472" r="2" fill="#283d3b"/>

      <!-- The admitted limit -->
      <text x="24" y="572" fill="#8f8a83" font-size="9" font-family="'Geist Mono', monospace">Not mine: the model, the retrieval stack, the data-source procurement. Where those were unresolved, I designed against the uncertainty and said so.</text>
    </svg>
  </div>
</body>
</html>
