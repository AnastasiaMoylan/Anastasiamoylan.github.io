  <title id="da-widget-title">The widget on shared rails</title>
  <desc id="da-widget-desc">A compliance-check widget embedded in a risk portal: its own regulatory filter layer on top, then five shared rails it reuses from the platform, document selection, search, comparison, citations and the response template, and a finding with numbered citations and a routed action.</desc>
