<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1440 900" width="1440" height="900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fc-gate-title fc-gate-desc">
  <title id="fc-gate-title">The promotion gate</title>
  <desc id="fc-gate-desc">Experimentation on the left, governed production on the right, and between them a promotion gate: a checklist of lineage, reviewer approval, confidence threshold, access policy and audit log. One control is unmet and the notice names it, so a blocked promotion reads as a rule, not a bug.</desc>
  <defs>
    <filter id="fc-gate-shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/></filter>
    <pattern id="fc-gate-grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="rgba(237,221,212,0.06)" stroke-width="1"/></pattern>
    <marker id="fc-gate-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#6b7f99"/></marker>
    <marker id="fc-gate-arrow-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#2457d6"/></marker>
    <marker id="fc-gate-arrow-r" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#dbc9c9"/></marker>
  </defs>
  <rect width="1440" height="900" fill="#1d2d2b"/>
  
