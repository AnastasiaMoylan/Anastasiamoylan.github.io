#dfe4ea"/><rect x="572" y="283" width="50.800000000000004" height="22" rx="11" fill="#e9edf2"/><text x="597.4" y="297.96" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="600" fill="#5c6675" text-anchor="middle">Draft</text><rect x="124" y="324" width="564" height="40" rx="6" fill="#ffffff" stroke="#d5dbe3" stroke-width="1"/><rect x="138" y="340" width="120" height="8" rx="4" fill="#dfe4ea"/><rect x="572" y="333" width="50.800000000000004" height="22" rx="11" fill="#e9edf2"/><text x="597.4" y="347.96" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="600" fill="#5c6675" text-anchor="middle">Draft</text><rect x="124" y="374" width="564" height="40" rx="6" fill="#ffffff" stroke="#d5dbe3" stroke-width="1"/><rect x="138" y="390" width="100" height="8" rx="4" fill="#dfe4ea"/><rect x="572" y="383" width="50.800000000000004" height="22" rx="11" fill="#e9edf2"/><text x="597.4" y="397.96" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="600" fill="#5c6675" text-anchor="middle">Draft</text><rect x="732" y="140" width="604" height="300" rx="10" fill="#1b2433" stroke="#1b2433" stroke-width="1"/><text x="752" y="168" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#7a9ae8" text-anchor="start" letter-spacing="1.2">PRODUCTION · GOVERNED</text><text x="752" y="196" font-family="'Inter', system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">Published analyses</text><rect x="752" y="224" width="564" height="40" rx="6" fill="#3a4557" stroke="#3a4557" stroke-width="1"/><rect x="766" y="240" width="160" height="8" rx="4" fill="#55627a"/><rect x="1200" y="233" width="69.28" height="22" rx="11" fill="#dcf2e3"/><text x="1234.64" y="247.96" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="600" fill="#15803d" text-anchor="middle">Governed</text><rect x="752" y="274" width="564" height="40" rx="6" fill="#3a4557" stroke="#3a4557" stroke-width="1"/><rect x="766" y="290" width="140" height="8" rx="4" fill="#55627a"/><rect x="1200" y="283" width="69.28" height="22" rx="11" fill="#dcf2e3"/><text x="1234.64" y="297.96" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="600" fill="#15803d" text-anchor="middle">Governed</text><rect x="752" y="324" width="564" height="40" rx="6" fill="#3a4557" stroke="#3a4557" stroke-width="1"/><rect x="766" y="340" width="120" height="8" rx="4" fill="#55627a"/><rect x="1200" y="333" width="69.28" height="22" rx="11" fill="#dcf2e3"/><text x="1234.64" y="347.96" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="600" fill="#15803d" text-anchor="middle">Governed</text><rect x="752" y="374" width="564" height="40" rx="6" fill="#3a4557" stroke="#3a4557" stroke-width="1"/><rect x="766" y="390" width="100" height="8" rx="4" fill="#55627a"/><rect x="1200" y="383" width="69.28" height="22" rx="11" fill="#dcf2e3"/><text x="1234.64" y="397.96" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="600" fill="#15803d" text-anchor="middle">Governed</text><path d="M704 290H736" stroke="#2457d6" stroke-width="2" marker-end="url(#fc-gate-arrow-m)"/><rect x="104" y="468" width="1232" height="300" rx="10" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="124" y="498" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#2457d6" text-anchor="start" letter-spacing="1.2">PROMOTION GATE · WHAT MUST BE TRUE</text><text x="124" y="528" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="600" fill="#1b2433" text-anchor="start">Promotion is an explicit, reviewable event. A blocked one names what is missing.</text><circle cx="133" cy="567" r="9" fill="#15803d"/><path d="M129 567l3 3 5-6" fill="none" stroke="#ffffff" stroke-width="1.8"/><text x="152" y="572" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="400" fill="#1b2433" text-anchor="start">Data lineage recorded for every input</text><circle cx="133" cy="599" r="9" fill="#15803d"/><path d="M129 599l3 3 5-6" fill="none" stroke="#ffffff" stroke-width="1.8"/><text x="152" y="604" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="400" fill="#1b2433" text-anchor="start">Reviewer approval · Controller, cost accounting</text><circle cx="133" cy="631" r="9" fill="#15803d"/><path d="M129 631l3 3 5-6" fill="none" stroke="#ffffff" stroke-width="1.8"/><text x="152" y="636" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="400" fill="#1b2433" text-anchor="start">Confidence above the production threshold</text><circle cx="133" cy="663" r="8" fill="#ffffff" stroke="#2457d6" stroke-width="2"/><circle cx="133" cy="663" r="3" fill="#2457d6"/><text x="152" y="668" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="600" fill="#1b2433" text-anchor="start">Access policy applied to the published analysis</text><circle cx="133" cy="695" r="8" fill="#ffffff" stroke="#d5dbe3" stroke-width="2"/><text x="152" y="700" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="400" fill="#5c6675" text-anchor="start">Change logged to the audit trail</text><rect x="724" y="552" width="592" height="130" rx="8" fill="#fbeedc" stroke="#b45309" stroke-width="1"/><text x="744" y="578" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#b45309" text-anchor="start" letter-spacing="1.2">BLOCKED · ONE CONTROL UNMET</text><text x="744" y="606" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="700" fill="#1b2433" text-anchor="start">Access policy not applied.</text><text x="744" y="628" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="400" fill="#5c6675" text-anchor="start">Request it from the workspace admin. The draft stays in</text><text x="744" y="646" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="400" fill="#5c6675" text-anchor="start">experimentation until this passes; nothing is lost.</text><rect x="724" y="704" width="220" height="38" rx="5" fill="#7a9ae8" stroke="#7a9ae8" stroke-width="1.5"/><text x="834" y="728.04" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Promote to production</text><text x="956" y="728" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#5c6675" text-anchor="start">Disabled until every control passes</text>
</svg>
