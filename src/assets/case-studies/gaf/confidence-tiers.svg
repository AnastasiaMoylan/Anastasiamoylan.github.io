<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1440 640" width="1440" height="640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fc-tiers-title fc-tiers-desc">
  <title id="fc-tiers-title">The three-tier boundary</title>
  <desc id="fc-tiers-desc">Three tiers across rising model confidence and falling consequence: stops and escalates, recommends and waits, acts on its own. The two cut-offs between them are marked pending, to be set with ML engineering. Below, three worked accrual examples placed in their tiers and the success definition: analyst behaviour within 72 hours, not forecast precision.</desc>
  <defs>
    <filter id="fc-tiers-shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.14"/></filter>
    <pattern id="fc-tiers-grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="rgba(40,61,59,0.06)" stroke-width="1"/></pattern>
    <marker id="fc-tiers-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#6b7f99"/></marker>
    <marker id="fc-tiers-arrow-m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#2457d6"/></marker>
    <marker id="fc-tiers-arrow-r" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#dbc9c9"/></marker>
  </defs>
  <rect width="1440" height="640" fill="#f3f5f8"/>
  
<text x="64" y="56" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#46596f" text-anchor="start" letter-spacing="1.2">THE THREE-TIER BOUNDARY · A PRODUCT DECISION, NOT A MODEL DEFAULT</text><text x="64" y="96" font-family="'Archivo', 'Inter', system-ui, sans-serif" font-size="26" font-weight="700" fill="#1b2433" text-anchor="start">Where the system acts, recommends, or stops and escalates</text><text x="64" y="122" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="400" fill="#5c6675" text-anchor="start">Confidence runs left to right. The cut-offs are set with ML engineering; the tiers and what each one may do were set by the product.</text><rect x="64" y="170" width="437.3333333333333" height="220" rx="0" fill="#fdebe3" stroke="#ffffff" stroke-width="3"/><rect x="64" y="170" width="437.3333333333333" height="8" rx="0" fill="#c2410c"/><text x="88" y="222" font-family="'Archivo', 'Inter', system-ui, sans-serif" font-size="20" font-weight="800" fill="#9a3412" text-anchor="start">Stops and escalates</text><text x="88" y="248" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#9a3412" text-anchor="start">Low confidence · high consequence</text><text x="88" y="282" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="400" fill="#1b2433" text-anchor="start">Nothing happens without a person. The item is</text><text x="88" y="304" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="400" fill="#1b2433" text-anchor="start">routed to a reviewer with the inputs the model</text><text x="88" y="326" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="400" fill="#1b2433" text-anchor="start">used.</text><rect x="501.3333333333333" y="170" width="437.3333333333333" height="220" rx="0" fill="#dfe7fb" stroke="#ffffff" stroke-width="3"/><rect x="501.3333333333333" y="170" width="437.3333333333333" height="8" rx="0" fill="#2457d6"/><text x="525.3333333333333" y="222" font-family="'Archivo', 'Inter', system-ui, sans-serif" font-size="20" font-weight="800" fill="#1a43ab" text-anchor="start">Recommends and waits</text><text x="525.3333333333333" y="248" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#1a43ab" text-anchor="start">Uncertain · reversible</text><text x="525.3333333333333" y="282" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="400" fill="#1b2433" text-anchor="start">The system proposes and shows its basis. A person</text><text x="525.3333333333333" y="304" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="400" fill="#1b2433" text-anchor="start">accepts, edits or declines before anything posts.</text><rect x="938.6666666666666" y="170" width="437.3333333333333" height="220" rx="0" fill="#dcf2e3" stroke="#ffffff" stroke-width="3"/><rect x="938.6666666666666" y="170" width="437.3333333333333" height="8" rx="0" fill="#15803d"/><text x="962.6666666666666" y="222" font-family="'Archivo', 'Inter', system-ui, sans-serif" font-size="20" font-weight="800" fill="#15803d" text-anchor="start">Acts on its own</text><text x="962.6666666666666" y="248" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#15803d" text-anchor="start">High confidence · low consequence</text><text x="962.6666666666666" y="282" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="400" fill="#1b2433" text-anchor="start">Routine, reversible steps run without a prompt</text><text x="962.6666666666666" y="304" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="400" fill="#1b2433" text-anchor="start">and are logged. Every action is replayable.</text><path d="M64 418H1364" stroke="#46596f" stroke-width="1.5" marker-end="url(#fc-tiers-arrow)"/><text x="64" y="444" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#46596f" text-anchor="start" letter-spacing="1.2">MODEL CONFIDENCE, RISING</text><text x="1376" y="444" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#46596f" text-anchor="end" letter-spacing="1.2">CONSEQUENCE, FALLING</text><path d="M501.3333333333333 156V404" stroke="#1b2433" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="427.3333333333333" y="130" width="148" height="24" rx="12" fill="#1b2433"/><text x="501.3333333333333" y="146" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">Cut-off A · pending</text><path d="M938.6666666666666 156V404" stroke="#1b2433" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="864.6666666666666" y="130" width="148" height="24" rx="12" fill="#1b2433"/><text x="938.6666666666666" y="146" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">Cut-off B · pending</text><text x="64" y="486" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#5c6675" text-anchor="start" letter-spacing="1.2">WORKED EXAMPLES · ACCRUALS</text><circle cx="74" cy="511" r="6" fill="#c2410c"/><text x="92" y="516" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="400" fill="#1b2433" text-anchor="start">Vendor accrual with no PO and a new supplier</text><text x="684" y="516" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="600" fill="#9a3412" text-anchor="start">Stops and escalates</text><circle cx="74" cy="551" r="6" fill="#2457d6"/><text x="92" y="556" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="400" fill="#1b2433" text-anchor="start">Estimate within 5% of last month, PO received</text><text x="684" y="556" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="600" fill="#1a43ab" text-anchor="start">Recommends and waits</text><circle cx="74" cy="591" r="6" fill="#15803d"/><text x="92" y="596" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="400" fill="#1b2433" text-anchor="start">Reverse last month’s accrual on invoice match</text><text x="684" y="596" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="600" fill="#15803d" text-anchor="start">Acts on its own</text><rect x="924" y="480" width="452" height="150" rx="10" fill="#ffffff" stroke="#1b2433" stroke-width="1.2"/><text x="944" y="506" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" font-weight="500" fill="#5c6675" text-anchor="start" letter-spacing="1.2">SUCCESS, AS DEFINED</text><text x="944" y="538" font-family="'Inter', system-ui, sans-serif" font-size="16" font-weight="700" fill="#1b2433" text-anchor="start">Analyst behaviour within 72 hours,</text><text x="944" y="560" font-family="'Inter', system-ui, sans-serif" font-size="16" font-weight="700" fill="#1b2433" text-anchor="start">not forecast precision.</text><text x="944" y="590" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="400" fill="#5c6675" text-anchor="start">Did the analyst act on, edit, or dismiss the</text><text x="944" y="608" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="400" fill="#5c6675" text-anchor="start">recommendation, and how quickly.</text>
</svg>
