  <title id="fc-plan-title">The copilot plan</title>
  <desc id="fc-plan-desc">A month-end close task with its accrual candidates, and beside it a copilot panel scoped to that task running four stages: understand, clarify, confirm, then plan. The plan is a checklist of steps with pause, resume and roll back, so wrong assumptions surface before a result does.</desc>
